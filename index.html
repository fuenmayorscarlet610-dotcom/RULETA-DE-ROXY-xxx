        .wheel-container {
            position: relative;
            width: 320px;

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 45px rgba(255, 0, 85, 0.4);
            border: 6px solid #1a0b2e;
        }

        .wheel-pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 16px solid transparent;
            border-right: 16px solid transparent;
            border-top: 32px solid var(--neon-pink);
            z-index: 10;
            filter: drop-shadow(0 0 12px var(--neon-pink));

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 1.25rem;
            font-weight: 800;
            border-radius: 40px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 3px;
            text-transform: uppercase;
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.5);
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .btn-primary:hover:not(:disabled) {
            transform: scale(1.03);
            box-shadow: 0 0 40px var(--neon-pink);
        }

        .btn-primary:disabled {
            background: #111;
            color: #444;
            box-shadow: none;
            cursor: not-allowed;

        .result-box {
            margin-top: 25px;

            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--gold);

            position: relative;
            overflow: hidden;
        }

        .winner-glow {
            animation: pulseGlow 1.5s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px var(--gold); }
            50% { box-shadow: 0 0 45px var(--neon-pink), inset 0 0 20px var(--neon-pink); border-color: var(--neon-pink); }
            100% { box-shadow: 0 0 15px var(--gold); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }

        .telegram-btn {

        }

        .telegram-btn:hover {
            background: #fff;
            box-shadow: 0 0 40px var(--neon-cyan);
            transform: scale(1.03);
        }

<body>

    </main>
        <script>
        // =========================================================
        // 1. PIN MAESTRO PARA ACTIVAR LOS TIROS
        // =========================================================
        const PIN_VALIDO = "10380466";

        // =========================================================
        // 2. RADAR TELEGRAM (Token del Bot y tu Chat ID)
        // =========================================================
        const TELEGRAM_BOT_TOKEN = "8661399731:AAE8OejHv80qeFDGeH8V_D5qmqNfvPxd91U"; 
        const TELEGRAM_CHAT_ID = "8499455364";

        function enviarRadar(mensaje) {
            if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return;
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: `🛰️ <b>RADAR RULETA VIP</b>\n${mensaje}`,
                    parse_mode: 'HTML'
                })
            }).then(res => res.json())
              .then(data => console.log('Radar enviado con éxito:', data))
              .catch(err => console.log('Error enviando radar:', err));
        }

        // =========================================================
        // REPRODUCCIÓN AUTOMÁTICA DE MÚSICA DE FONDO
        // =========================================================
        const bgAudio = document.getElementById('bgAudio');
        bgAudio.volume = 0.5;

        // Forzar reproducción inicial y mediante cualquier evento de toque/clic por políticas del navegador
        function iniciarMusica() {
            bgAudio.play().catch(e => console.log("Audio pendiente de interacción."));
        }

        window.addEventListener('load', () => {
            iniciarMusica();
        });

        document.addEventListener('click', iniciarMusica, { once: true });
        document.addEventListener('touchstart', iniciarMusica, { once: true });
        document.addEventListener('keydown', iniciarMusica, { once: true });

        // =========================================================
        // PREMIOS DE LA RULETA
        // =========================================================
        const premios = [
            { texto: "Sexting", color: "#ff0055", tipo: "premio" },
            { texto: "Videollamadas", color: "#7000ff", tipo: "premio" },
            { texto: "Presencial 35$", color: "#ffb700", tipo: "premio" },
            { texto: "Presencial Free", color: "#d90048", tipo: "premio" },
            { texto: "VIP 1 semana", color: "#00f3ff", tipo: "premio" },
            { texto: "VIP de por vida", color: "#5d00d6", tipo: "premio" },
            { texto: "Pack de fotos", color: "#00b3cc", tipo: "premio" },
            { texto: "Nada", color: "#111111", tipo: "pierde" },
            { texto: "Audios ricos", color: "#cc0044", tipo: "premio" },
            { texto: "Vídeos", color: "#330088", tipo: "premio" },
            { texto: "Nada", color: "#0a0a0a", tipo: "pierde" }
        ];

        const telegramLink = "https://t.me/TRoxyVenomT";
        let isSpinning = false;
        let audioCtx = null;
        let ruletaActivada = false;

        // LLAVE DE MEMORIA ANTI-FRAUDE (Versión 4 limpia)
        const MEMORY_KEY = 'roxy_spin_ticket_v4';

        window.addEventListener('DOMContentLoaded', () => {
            dibujarRuleta(0);
            if (localStorage.getItem(MEMORY_KEY)) {
                bloquearPorTiroUsado();
            }
        });

        function bloquearPorTiroUsado() {
            document.getElementById('loginSessionBox').style.display = 'none';
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.innerText = "❌ TIRO CONSUMIDO";
            
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';
            resultBox.className = 'result-box'; 
            resultBox.innerHTML = `
                <div style="color:var(--neon-pink); margin-bottom:12px; font-size:1.3rem;">🛑 Límite alcanzado</div>
                <span style="font-size:1.1rem; font-weight:normal; color:#ddd;">Ya consumiste tu tiro exclusivo en este dispositivo.</span><br><br>
                <a href="https://t.me/TRoxyVenomT?text=Hola%20Roxy,%20quiero%20comprar%20OTRO%20PIN%20de%20tiro%20para%20la%20ruleta" target="_blank" class="btn-buy" style="margin-top:5px;">💳 COMPRAR NUEVO TIRO</a>
            `;
        }

        function activarRuleta() {
            if (localStorage.getItem(MEMORY_KEY)) {
                bloquearPorTiroUsado();
                return;
            }

            const pinInput = document.getElementById('userPinInput');
            const pin = pinInput.value.trim();
            
            if (pin === PIN_VALIDO) {
                ruletaActivada = true;
                document.getElementById('loginSessionBox').style.display = 'none';
                
                const btnGirar = document.getElementById('spinBtn');
                btnGirar.disabled = false;
                btnGirar.innerText = "¡GIRAR RULETA VIP!";
                btnGirar.style.boxShadow = "0 0 35px var(--neon-pink)";
                
                playBeep(600, 0.1);
                enviarRadar(`🔓 <b>INGRESO APROBADO</b>\nEl PIN <code>${pin}</code> ha sido activado correctamente.`);
            } else {
                alert("PIN INCORRECTO. Adquiere tu PIN válido por Telegram.");
                playLoseSound();
                pinInput.value = "";
            }
        }

        // =========================================================
        // MOTOR DE AUDIO (EFECTOS)
        // =========================================================
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playBeep(freq, duration, type = 'sine') {
            initAudio();
            if(!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playWinSound() {
            playBeep(523.25, 0.15); setTimeout(() => playBeep(659.25, 0.15), 150);
            setTimeout(() => playBeep(783.99, 0.3), 300); setTimeout(() => playBeep(1046.50, 0.6), 450);
        }

        function playLoseSound() {
            playBeep(250, 0.3, 'sawtooth');
            setTimeout(() => playBeep(150, 0.5, 'sawtooth'), 250);
        }

        // =========================================================
        // MOTOR GRÁFICO (CANVAS)
        // =========================================================
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const radius = canvas.width / 2;
        let currentAngle = 0;

        function dibujarRuleta(anguloRotacion = 0) {
            const arc = (2 * Math.PI) / premios.length;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            premios.forEach((premio, i) => {
                const angle = anguloRotacion + i * arc;
                
                ctx.beginPath();
                ctx.fillStyle = premio.color;
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 5, angle, angle + arc, false);
                ctx.lineTo(radius, radius);
                ctx.fill();
                ctx.strokeStyle = '#030105';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 12px 'Rajdhani', sans-serif";
                ctx.shadowColor = "rgba(0,0,0,0.9)";
                ctx.shadowBlur = 5;
                ctx.fillText(premio.texto, radius - 22, 4);
                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(radius, radius, 25, 0, 2 * Math.PI);
            ctx.fillStyle = '#030105';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'var(--neon-purple)';
            ctx.stroke();
        }

        function girarRuleta() {
            if (isSpinning || !ruletaActivada) return;
            
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('spinBtn').style.boxShadow = "none";

            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'none';
            resultBox.className = 'result-box';

            let spinAngleValue = Math.random() * 2000 + 4000;
            let start = null;
            let duration = 5000;

            function animar(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let easeOut = 1 - Math.pow(1 - Math.min(progress / duration, 1), 3);
                let currentRot = currentAngle + easeOut * spinAngleValue;

                dibujarRuleta(currentRot);
                
                if (Math.random() > 0.75) playBeep(900, 0.02, 'square');

                if (progress < duration) {
                    requestAnimationFrame(animar);
                } else {
                    currentAngle = currentRot % (2 * Math.PI);
                    isSpinning = false;
                    
                    // BLOQUEO DEFINITIVO DE ESTE DISPOSITIVO
                    localStorage.setItem(MEMORY_KEY, 'true');

                    const arc = (2 * Math.PI) / premios.length;
                    const pointerAngle = 3 * Math.PI / 2;
                    const relativeAngle = (pointerAngle - currentAngle + 2 * Math.PI) % (2 * Math.PI);
                    const index = Math.floor(relativeAngle / arc);
                    const ganado = premios[index];

                    resultBox.style.display = 'block';

                    // ENVÍO INMEDIATO AL RADAR DE TELEGRAM
                    enviarRadar(`🎯 <b>RESULTADO OFICIAL DEL TIRO</b>\n<b>Premio Obtenido:</b> <code>${ganado.texto}</code>`);

                    if(ganado.tipo === "premio") {
                        playWinSound();
                        resultBox.classList.add('winner-glow');
                        
                        let mensajeAEnviar = `${telegramLink}?text=Hola%20Roxy,%20inserté%20mi%20PIN%20y%20gané%20el%20premio:%20*${encodeURIComponent(ganado.texto)}*.%20¡Vengo%20a%20reclamarlo!`;
                        
                        resultBox.innerHTML = `
                            <div style="font-size:1.5rem; color:var(--gold); margin-bottom:8px;">✨ ¡SELECCIÓN GANADORA! ✨</div>
                            <div style="font-size:2.2rem; color:var(--neon-pink); margin-bottom:18px; text-shadow: 0 0 15px var(--neon-pink); line-height:1.1;">${ganado.texto}</div>
                            <a href="${mensajeAEnviar}" target="_blank" class="telegram-btn">💬 RECLAMAR MI PREMIO AQUÍ</a>
                        `;
                    } else {
                        playLoseSound();
                        resultBox.innerHTML = `
                            <div style="color:#ff3333; margin-bottom:12px; font-size:1.3rem;">❌ ¡Oh no! Caíste en <strong>${ganado.texto}</strong></div>
                            <span style="font-size:1.1rem; font-weight:normal; color:#bbb;">La suerte no te acompañó esta vez.</span>
                        `;
                    }

                    setTimeout(() => {
                        bloquearPorTiroUsado();
                    }, 5500);
                }
            }
            requestAnimationFrame(animar);
        }
    </script>
</body>
