<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #030105;
            --panel-bg: rgba(10, 5, 15, 0.95);
            --neon-pink: #ff0055;
            --neon-purple: #7000ff;
            --neon-cyan: #00f3ff;
            --gold: #ffb700;
            --text-main: #f0e6f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(112, 0, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 90% 90%, rgba(255, 0, 85, 0.1) 0%, transparent 50%);
        }

        header {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: linear-gradient(180deg, rgba(3,1,5,1) 0%, rgba(3,1,5,0.8) 100%);

            box-shadow: 0 0 25px rgba(112, 0, 255, 0.2);

            top: 0;
            z-index: 100;
        }

        .top-banner-text {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            color: var(--neon-cyan);
            text-shadow: 0 0 12px var(--neon-cyan);
            letter-spacing: 3px;
            text-align: center;
        }

        .header-content {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 480px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-pic {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid var(--neon-pink);
            object-fit: cover;
            box-shadow: 0 0 15px var(--neon-pink);
        }

        .brand h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--text-main);
            text-shadow: 0 0 10px var(--neon-pink);
            letter-spacing: 2px;
        }

        .music-player {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(112, 0, 255, 0.1);
            border: 1px solid var(--neon-purple);
            padding: 6px 12px;
            border-radius: 20px;
        }

        .music-btn {
            background: none;
            border: none;
            color: var(--neon-cyan);
            cursor: pointer;
            font-size: 1.1rem;
            text-shadow: 0 0 8px var(--neon-cyan);
        }

        main {
            width: 100%;
            max-width: 480px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(112, 0, 255, 0.3);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255,0,85,0.05);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 1rem;
            color: var(--neon-cyan);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px;
            background: rgba(0,0,0,0.8);
            border: 1px solid rgba(255, 0, 85, 0.5);
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-align: center;
            outline: none;
            transition: box-shadow 0.3s;
        }

        .input-wrapper input:focus {
            box-shadow: 0 0 15px rgba(255,0,85,0.4);
        }

        .btn-icon {
            background: var(--neon-pink);
            color: #fff;
            border: none;
            padding: 0 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            text-transform: uppercase;
            transition: all 0.3s;
            box-shadow: 0 0 10px rgba(255,0,85,0.4);
        }

        .btn-icon:hover {
            background: #ff3377;
            box-shadow: 0 0 20px rgba(255,0,85,0.8);
        }

        .btn-buy {
            background: transparent;
            color: var(--gold);
            font-weight: 700;
            text-decoration: none;
            display: block;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--gold);
            margin-top: 15px;
            transition: all 0.3s;
            text-transform: uppercase;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .btn-buy:hover {
            background: rgba(255, 183, 0, 0.1);
            box-shadow: 0 0 15px rgba(255, 183, 0, 0.3);
        }

        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 20px auto;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 35px rgba(255, 0, 85, 0.3);
            border: 5px solid #1a0b2e;
        }

        .wheel-pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 14px solid transparent;
            border-right: 14px solid transparent;
            border-top: 28px solid var(--neon-pink);
            z-index: 10;
            filter: drop-shadow(0 0 10px var(--neon-pink));
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 1.2rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 0, 85, 0.4);
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px var(--neon-pink);
        }

        .btn-primary:disabled {
            background: #1a1a1a;
            color: #555;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            margin-top: 20px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--gold);
            border-radius: 12px;
            font-size: 1.2rem;
            color: #fff;
            font-weight: 700;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
            position: relative;
            overflow: hidden;
        }

        .winner-glow {
            animation: pulseGlow 1.5s infinite;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px var(--gold); }
            50% { box-shadow: 0 0 35px var(--neon-pink), inset 0 0 15px var(--neon-pink); border-color: var(--neon-pink); }
            100% { box-shadow: 0 0 15px var(--gold); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .telegram-btn {
            display: inline-block;
            margin-top: 15px;
            background: var(--neon-cyan);
            color: #000;
            padding: 14px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 800;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.4);
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .telegram-btn:hover {
            background: #fff;
            box-shadow: 0 0 30px var(--neon-cyan);
            transform: scale(1.02);
        }
    </style>
</head>
<body>

    <header>
        <div class="top-banner-text">𝖈 ⎈ 𝕿℟𝖔𝖝𝖞𝖁𝖊𝖓𝖔𝖒𝕿 ⎈ 𝖈</div>
        
        <div class="header-content">
            <div class="brand">
                <img src="https://i.postimg.cc/BQghd9h2/IMG-20261003-044421-994.jpg" alt="Perfil" class="profile-pic">
                <h1>Roxy VIP</h1>
            </div>
            
            <div class="music-player">
                <button class="music-btn" id="playMusicBtn" onclick="toggleMusic()">🎵</button>

        </div>
    </header>

    <audio id="bgAudio" loop autoplay>
        <source src="musica.mp3" type="audio/mpeg">
    </audio>

    <main>
        <div class="card">
            
            <!-- CAJA DE LOGIN / COMPRA -->
            <div id="loginSessionBox">
                <div class="input-group">
                    <label>Insertar PIN para jugar</label>
                    <div class="input-wrapper">
                        <input type="password" id="userPinInput" placeholder="********">
                        <button class="btn-icon" onclick="activarRuleta()">ENTRAR</button>
                    </div>
                </div>
                
                <a href="https://t.me/TRoxyVenomT?text=Hola%20Roxy,%20quiero%20comprar%20un%20PIN%20de%20tiro%20para%20el%20concurso%20de%20la%20ruleta" target="_blank" class="btn-buy">
                    🛒 Comprar tiro para concurso de la ruleta
                </a>
            </div>

            <!-- RULETA -->
            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <canvas id="wheelCanvas" width="300" height="300"></canvas>
            </div>

            <button class="btn-primary" id="spinBtn" onclick="girarRuleta()" disabled>🔒 ESPERANDO PIN...</button>

            <!-- RESULTADO -->
            <div class="result-box" id="resultBox"></div>
        </div>
    </main>
        <script>
        // =========================================================
        // 1. EL PIN PARA ACTIVAR LOS TIROS
        // CÁMBIALO AQUÍ CUANDO LO DESEES
        // =========================================================
        const PIN_VALIDO = "10380466";

        // =========================================================
        // 2. CONFIGURACIÓN DEL RADAR EN VIVO (TELEGRAM BOT)
        // (Asegúrate de poner tu NUEVO token de @BotFather aquí)
        // =========================================================
        const TELEGRAM_BOT_TOKEN = "NUEVO_TOKEN_AQUI"; 
        const TELEGRAM_CHAT_ID = "8499455364";

        function enviarRadar(mensaje) {
            if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return;
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: `🛰️ <b>RADAR RULETA VIP</b>\n${mensaje}`,
                    parse_mode: 'HTML'
                })
            }).catch(e => console.log('Error Radar:', e));
        }

        // =========================================================
        // MÚSICA AMBIENTAL
        // =========================================================
        const bgAudio = document.getElementById('bgAudio');
        bgAudio.volume = 0.5;

        document.body.addEventListener('click', () => {
            if (bgAudio.paused) {
                bgAudio.play().catch(e => console.log("Navegador bloquea autoplay."));
            }
        });

        function toggleMusic() {
            if (bgAudio.paused) {
                bgAudio.play();
                document.getElementById('playMusicBtn').innerText = "⏸";
            } else {
                bgAudio.pause();
                document.getElementById('playMusicBtn').innerText = "🎵";
            }
        }

        // =========================================================
        // PREMIOS DE LA RULETA (Estilo Dark)
        // =========================================================
        const premios = [
            { texto: "Sexting", color: "#ff0055", tipo: "premio" },
            { texto: "Videollamadas", color: "#7000ff", tipo: "premio" },
            { texto: "Presencial 35$", color: "#ffb700", tipo: "premio" },
            { texto: "Presencial Free", color: "#d90048", tipo: "premio" },
            { texto: "VIP 1 semana", color: "#00f3ff", tipo: "premio" },
            { texto: "VIP de por vida", color: "#5d00d6", tipo: "premio" },
            { texto: "Pack de fotos", color: "#00b3cc", tipo: "premio" },
            { texto: "Nada", color: "#111111", tipo: "pierde" },
            { texto: "Audios ricos", color: "#cc0044", tipo: "premio" },
            { texto: "Vídeos", color: "#330088", tipo: "premio" },
            { texto: "Nada", color: "#0a0a0a", tipo: "pierde" }
        ];

        const telegramLink = "https://t.me/TRoxyVenomT";
        let isSpinning = false;
        let audioCtx = null;
        let ruletaActivada = false;

        // NUEVA LLAVE DE MEMORIA PARA REINICIAR LOS TIROS VIEJOS
        const MEMORY_KEY = 'roxy_spin_ticket_v2';

        window.addEventListener('DOMContentLoaded', () => {
            dibujarRuleta(0);
            if (localStorage.getItem(MEMORY_KEY)) {
                bloquearPorTiroUsado();
            }
        });

        function bloquearPorTiroUsado() {
            document.getElementById('loginSessionBox').style.display = 'none';
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.innerText = "❌ TIRO CONSUMIDO";
            
            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'block';
            resultBox.className = 'result-box'; // Quitar efecto neón
            resultBox.innerHTML = `
                <div style="color:var(--neon-pink); margin-bottom:10px;">🛑 Límite alcanzado</div>
                <span style="font-size:1rem; font-weight:normal;">Ya consumiste tu tiro exclusivo.</span><br><br>
                <a href="https://t.me/TRoxyVenomT?text=Hola%20Roxy,%20quiero%20comprar%20OTRO%20PIN%20de%20tiro" target="_blank" class="btn-buy" style="margin-top:0;">💳 COMPRAR NUEVO TIRO</a>
            `;
        }

        function activarRuleta() {
            if (localStorage.getItem(MEMORY_KEY)) {
                bloquearPorTiroUsado();
                return;
            }

            const pinInput = document.getElementById('userPinInput');
            const pin = pinInput.value.trim();
            
            if (pin === PIN_VALIDO) {
                ruletaActivada = true;
                document.getElementById('loginSessionBox').style.display = 'none';
                
                const btnGirar = document.getElementById('spinBtn');
                btnGirar.disabled = false;
                btnGirar.innerText = "¡GIRAR RULETA VIP!";
                btnGirar.style.boxShadow = "0 0 30px var(--neon-pink)";
                
                playBeep(600, 0.1);
                enviarRadar(`🔓 <b>INGRESO APROBADO</b>\nUn usuario ha insertado el PIN correcto y está listo para jugar.`);
            } else {
                alert("PIN INCORRECTO. Adquiere tu PIN por Telegram.");
                playLoseSound();
                pinInput.value = "";
            }
        }

        // =========================================================
        // MOTOR DE AUDIO SINTÉTICO (EFECTOS)
        // =========================================================
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playBeep(freq, duration, type = 'sine') {
            initAudio();
            if(!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playWinSound() {
            playBeep(523.25, 0.15); setTimeout(() => playBeep(659.25, 0.15), 150);
            setTimeout(() => playBeep(783.99, 0.3), 300); setTimeout(() => playBeep(1046.50, 0.6), 450);
        }

        function playLoseSound() {
            playBeep(250, 0.3, 'sawtooth');
            setTimeout(() => playBeep(150, 0.5, 'sawtooth'), 250);
        }

        // =========================================================
        // MOTOR GRÁFICO (CANVAS)
        // =========================================================
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const radius = canvas.width / 2;
        let currentAngle = 0;

        function dibujarRuleta(anguloRotacion = 0) {
            const arc = (2 * Math.PI) / premios.length;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            premios.forEach((premio, i) => {
                const angle = anguloRotacion + i * arc;
                
                ctx.beginPath();
                ctx.fillStyle = premio.color;
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 5, angle, angle + arc, false);
                ctx.lineTo(radius, radius);
                ctx.fill();
                ctx.strokeStyle = '#030105';
                ctx.lineWidth = 3;
                ctx.stroke();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 11px 'Rajdhani', sans-serif";
                ctx.shadowColor = "rgba(0,0,0,0.8)";
                ctx.shadowBlur = 4;
                ctx.fillText(premio.texto, radius - 20, 4);
                ctx.restore();
            });

            // Centro Dark
            ctx.beginPath();
            ctx.arc(radius, radius, 22, 0, 2 * Math.PI);
            ctx.fillStyle = '#030105';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = 'var(--neon-purple)';
            ctx.stroke();
        }

        function girarRuleta() {
            if (isSpinning || !ruletaActivada) return;
            
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'none';
            resultBox.className = 'result-box'; // reset class

            let spinAngleValue = Math.random() * 2000 + 3500; // Giro más largo
            let start = null;
            let duration = 4500;

            function animar(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let easeOut = 1 - Math.pow(1 - Math.min(progress / duration, 1), 3);
                let currentRot = currentAngle + easeOut * spinAngleValue;

                dibujarRuleta(currentRot);
                
                // Sonido de "Tick" rápido mientras gira
                if (Math.random() > 0.7) playBeep(900, 0.02, 'square');

                if (progress < duration) {
                    requestAnimationFrame(animar);
                } else {
                    currentAngle = currentRot % (2 * Math.PI);
                    isSpinning = false;
                    
                    // GASTAR EL TIRO DEFINITIVAMENTE
                    localStorage.setItem(MEMORY_KEY, 'true');

                    const arc = (2 * Math.PI) / premios.length;
                    const pointerAngle = 3 * Math.PI / 2; // Apunta arriba (270°)
                    const relativeAngle = (pointerAngle - currentAngle + 2 * Math.PI) % (2 * Math.PI);
                    const index = Math.floor(relativeAngle / arc);
                    const ganado = premios[index];

                    resultBox.style.display = 'block';

                    enviarRadar(`🎯 <b>RESULTADO DEL TIRO</b>\n<b>Premio:</b> <code>${ganado.texto}</code>`);

                    if(ganado.tipo === "premio") {
                        playWinSound();
                        resultBox.classList.add('winner-glow'); // EFECTO NEÓN LLAMATIVO
                        
                        let mensajeAEnviar = `${telegramLink}?text=Hola%20Roxy,%20inserté%20mi%20PIN%20y%20gané%20el%20premio:%20*${encodeURIComponent(ganado.texto)}*.%20¡Vengo%20a%20reclamarlo!`;
                        
                        resultBox.innerHTML = `
                            <div style="font-size:1.5rem; color:var(--gold); margin-bottom:5px;">✨ ¡SELECCIÓN GANADORA! ✨</div>
                            <div style="font-size:2rem; color:var(--neon-pink); margin-bottom:15px; text-shadow: 0 0 10px var(--neon-pink);">${ganado.texto}</div>
                            <a href="${mensajeAEnviar}" target="_blank" class="telegram-btn">💬 RECLAMAR MI PREMIO AQUÍ</a>
                        `;
                    } else {
                        playLoseSound();
                        resultBox.innerHTML = `
                            <div style="color:#ff3333; margin-bottom:10px;">❌ ¡Oh no! Caíste en <strong>${ganado.texto}</strong></div>
                            <span style="font-size:1rem; font-weight:normal; color:#aaa;">La suerte no te acompañó esta vez.</span>
                        `;
                    }

                    setTimeout(() => {
                        bloquearPorTiroUsado();
                    }, 5000);
                }
            }
            requestAnimationFrame(animar);
        }
    </script>
</body>
</html>
