    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a060f;
            --panel-bg: rgba(18, 12, 24, 0.9);
            --neon-pink: #ff2a85;
            --neon-purple: #9d00ff;
            --neon-cyan: #00f3ff;
            --gold: #ffd700;
            --text-main: #f0e6f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(157, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 42, 133, 0.15) 0%, transparent 40%);
        }

        header {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 6, 15, 0.95);
            border-bottom: 1px solid rgba(255, 42, 133, 0.3);
            box-shadow: 0 0 20px rgba(157, 0, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-pic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--neon-pink);
            object-fit: cover;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .brand h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            color: var(--text-main);
            text-shadow: 0 0 10px var(--neon-pink);
            letter-spacing: 1px;
        }

        main {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(157, 0, 255, 0.4);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            text-align: center;
        }

        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 10px auto;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 42, 133, 0.5);
            border: 4px solid var(--neon-purple);
        }

        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid var(--neon-pink);
            z-index: 10;
            filter: drop-shadow(0 0 8px var(--neon-pink));
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 42, 133, 0.5);
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px var(--neon-pink);
        }

        .btn-primary:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--neon-cyan);
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 42, 133, 0.4);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        .result-box {
            margin-top: 15px;
            padding: 15px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            border-radius: 8px;
            font-size: 1.1rem;
            color: var(--neon-cyan);
            font-weight: 700;
            display: none;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .telegram-btn {
            display: inline-block;
            margin-top: 15px;
            background: #0088cc;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 0 15px rgba(0, 136, 204, 0.5);
            transition: all 0.3s;
            width: 100%;
        }
        
        .telegram-btn:hover {
            background: #0099ee;
            box-shadow: 0 0 25px rgba(0, 136, 204, 0.8);
            transform: scale(1.02);
        }
        
        .btn-icon {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 0 5px rgba(0, 243, 255, 0.2);
            font-size: 0.85rem;
        }

        .btn-icon:hover {
            background: var(--neon-cyan);
            color: var(--bg-deep);
            box-shadow: 0 0 15px var(--neon-cyan);
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <!-- =========================================================
                 FOTO DE PERFIL DE LA PÁGINA
                 ========================================================= -->
            <img src="https://i.postimg.cc/BQghd9h2/IMG-20261003-044421-994.jpg" alt="Perfil" class="profile-pic" id="headerProfilePic">
            <h1 id="headerBrandName">Roxy VIP</h1>
        </div>
    </header>

    <main>
        <div class="card">
            
            <div class="input-group" id="loginSessionBox">
                <label>Ingresa el PIN de activación para jugar:</label>
                <div style="display: flex; gap: 8px;">
                    <input type="password" id="userPinInput" placeholder="Ej: ****">
                    <button class="btn-icon" onclick="activarRuleta()">Acceder</button>
                </div>
            </div>

            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <canvas id="wheelCanvas" width="300" height="300"></canvas>
            </div>

            <button class="btn-primary" id="spinBtn" onclick="girarRuleta()" disabled>¡BLOQUEADO!</button>

            <div class="result-box" id="resultBox"></div>
        </div>
    </main>

    <script>
        // --- OPCIONES EXACTAS DE LA RULETA SOLICITADAS ---
        const premios = [
            { texto: "Sexting", color: "#ff2a85", tipo: "premio" },
            { texto: "Videollamadas 5min", color: "#9d00ff", tipo: "premio" },
            { texto: "Presencial 35$h", color: "#ffd700", tipo: "premio" },
            { texto: "Presencial gratuito", color: "#ff0055", tipo: "premio" },
            { texto: "Canal VIP 1 semana", color: "#00dfc4", tipo: "premio" },
            { texto: "Canal VIP de por vida", color: "#7928ca", tipo: "premio" },
            { texto: "Pack de fotos", color: "#00f3ff", tipo: "premio" },
            { texto: "Nada", color: "#444444", tipo: "pierde" },
            { texto: "Audios ricos", color: "#ff55aa", tipo: "premio" },
            { texto: "Vídeos", color: "#330066", tipo: "premio" },
            { texto: "Nada", color: "#222222", tipo: "pierde" }
        ];

        // --- ENLACE A TU PRIVADO EN TELEGRAM ---
        const telegramLink = "https://t.me/TRoxyVenomT";

        let isSpinning = false;
        let audioCtx = null;
        let ruletaActivada = false;

        // --- ACTIVAR RULETA CON EL PIN 1712 ---
        function activarRuleta() {
            const pin = document.getElementById('userPinInput').value.trim();
            if (pin === "1712") {
                ruletaActivada = true;
                document.getElementById('loginSessionBox').style.display = 'none';
                
                const btnGirar = document.getElementById('spinBtn');
                btnGirar.disabled = false;
                btnGirar.innerText = "¡GIRAR RULETA!";
                
                playBeep(600, 0.1);
            } else {
                alert("PIN incorrecto. Acceso denegado.");
                playLoseSound();
            }
        }

        // --- EFECTOS DE SONIDO SINTÉTICOS ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBeep(freq, duration, type = 'sine') {
            initAudio();
            if(!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playWinSound() {
            playBeep(523.25, 0.15); setTimeout(() => playBeep(659.25, 0.15), 150);
            setTimeout(() => playBeep(783.99, 0.3), 300); setTimeout(() => playBeep(1046.50, 0.5), 450);
        }

        function playLoseSound() {
            playBeep(300, 0.2, 'sawtooth');
            setTimeout(() => playBeep(220, 0.4, 'sawtooth'), 200);
        }

        // --- CONFIGURACIÓN DE LA RULETA ---
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const radius = canvas.width / 2;
        let currentAngle = 0;

        function dibujarRuleta(anguloRotacion = 0) {
            const arc = (2 * Math.PI) / premios.length;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            premios.forEach((premio, i) => {
                const angle = anguloRotacion + i * arc;
                ctx.beginPath();
                ctx.fillStyle = premio.color;
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 5, angle, angle + arc, false);
                ctx.lineTo(radius, radius);
                ctx.fill();
                ctx.strokeStyle = '#0a060f';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                // Ajuste del texto para que entre bien
                ctx.font = "bold 10px 'Rajdhani', sans-serif";
                ctx.fillText(premio.texto, radius - 15, 4);
                ctx.restore();
            });

            // Centro negro
            ctx.beginPath();
            ctx.arc(radius, radius, 18, 0, 2 * Math.PI);
            ctx.fillStyle = '#0a060f';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'var(--neon-pink)';
            ctx.stroke();
        }

        function girarRuleta() {
            if (isSpinning || !ruletaActivada) return;
            
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'none';

            let spinAngleValue = Math.random() * 2000 + 3000;
            let start = null;
            let duration = 4000;

            function animar(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let easeOut = 1 - Math.pow(1 - Math.min(progress / duration, 1), 3);
                let currentRot = currentAngle + easeOut * spinAngleValue;

                dibujarRuleta(currentRot);
                playBeep(800, 0.05, 'square');

                if (progress < duration) {
                    requestAnimationFrame(animar);
                } else {
                    currentAngle = currentRot % (2 * Math.PI);
                    isSpinning = false;
                    document.getElementById('spinBtn').disabled = false;
                    
                    const arc = (2 * Math.PI) / premios.length;
                    const normalizedAngle = (2 * Math.PI - (currentAngle % (2 * Math.PI)) + Math.PI / 2) % (2 * Math.PI);
                    const index = Math.floor(normalizedAngle / arc) % premios.length;
                    const ganado = premios[index];

                    resultBox.style.display = 'block';

                    if(ganado.tipo === "premio") {
                        playWinSound();
                        let mensajeAEnviar = `${telegramLink}?text=Hola%20Roxy,%20he%20girado%20la%20ruleta%20VIP%20y%20gané:%20*${encodeURIComponent(ganado.texto)}*.%20¡Vengo%20a%20reclamarlo!`;
                        
                        resultBox.innerHTML = `🎉 ¡FELICIDADES!<br>Ganaste: <strong>${ganado.texto}</strong><br>
                        <a href="${mensajeAEnviar}" target="_blank" class="telegram-btn">💬 RECLAMAR EN MI PRIVADO</a>`;
                    } else {
                        playLoseSound();
                        resultBox.innerHTML = `❌ ¡Caíste en <strong>${ganado.texto}</strong>!<br><span style="font-size:0.95rem; color:#aaa;">La suerte no estuvo de tu lado, ¡gira de nuevo!</span>`;
                    }
                }
            }
            requestAnimationFrame(animar);
        }

        // Cargar ruleta inmediatamente al entrar a la página
        setTimeout(() => {
            dibujarRuleta(0);
        }, 100);
    </script>
</body>
