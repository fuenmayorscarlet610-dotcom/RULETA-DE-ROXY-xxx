<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta Casino VIP | Edición Exclusiva</title>
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #0a060f;
            --panel-bg: rgba(18, 12, 24, 0.85);
            --neon-pink: #ff2a85;
            --neon-purple: #9d00ff;
            --neon-cyan: #00f3ff;
            --gold: #ffd700;
            --text-main: #f0e6f6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(157, 0, 255, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(255, 42, 133, 0.15) 0%, transparent 40%);
        }

        header {
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(10, 6, 15, 0.9);
            border-bottom: 1px solid rgba(255, 42, 133, 0.3);
            box-shadow: 0 0 20px rgba(157, 0, 255, 0.2);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .profile-pic {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid var(--neon-pink);
            object-fit: cover;
            box-shadow: 0 0 10px var(--neon-pink);
        }

        .brand h1 {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            color: var(--text-main);
            text-shadow: 0 0 10px var(--neon-pink);
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
            transition: all 0.3s;
            box-shadow: 0 0 5px rgba(0, 243, 255, 0.2);
        }

        .btn-icon:hover {
            background: var(--neon-cyan);
            color: var(--bg-deep);
            box-shadow: 0 0 15px var(--neon-cyan);
        }

        main {
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .card {
            background: var(--panel-bg);
            border: 1px solid rgba(157, 0, 255, 0.4);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            text-align: center;
        }

        .status-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 10px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            margin-bottom: 15px;
        }

        .stat-item span {
            color: var(--gold);
            font-weight: 700;
            font-size: 1.1rem;
        }

        /* Ruleta Canvas Container */
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 10px auto;
        }

        canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(255, 42, 133, 0.5);
            border: 4px solid var(--neon-purple);
        }

        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 12px solid transparent;
            border-right: 12px solid transparent;
            border-top: 24px solid var(--neon-pink);
            z-index: 10;
            filter: drop-shadow(0 0 8px var(--neon-pink));
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 0 20px rgba(255, 42, 133, 0.5);
            transition: all 0.3s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 30px var(--neon-pink);
        }

        .btn-primary:disabled {
            background: #444;
            color: #888;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* Formularios y Modales */
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--neon-cyan);
            margin-bottom: 5px;
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 10px;
            background: rgba(0,0,0,0.6);
            border: 1px solid rgba(255, 42, 133, 0.4);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 3, 8, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--neon-pink);
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(255, 42, 133, 0.4);
            position: relative;
            max-height: 90vh;
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: none;
            border: none;
            color: var(--neon-pink);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .bank-data {
            background: rgba(0,0,0,0.5);
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid var(--gold);
            margin: 10px 0;
            font-size: 0.95rem;
            text-align: left;
        }

        .result-box {
            margin-top: 15px;
            padding: 12px;
            background: rgba(0, 243, 255, 0.1);
            border: 1px solid var(--neon-cyan);
            border-radius: 8px;
            font-size: 1.1rem;
            color: var(--neon-cyan);
            font-weight: 700;
            display: none;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150" alt="Perfil" class="profile-pic" id="headerProfilePic">
            <h1 id="headerBrandName">VIP Roulette</h1>
        </div>
        <div class="header-actions">
            <button class="btn-icon" onclick="toggleAudio()" id="audioBtn">🎵 Música</button>
            <button class="btn-icon" onclick="openModal('adminModal')">⚙️ Admin</button>
        </div>
    </header>

    <main>
        <!-- Tarjeta Principal de la Ruleta -->
        <div class="card">
            <div class="status-bar">
                <div class="stat-item">Cédula: <span id="lblCedula">No registrada</span></div>
                <div class="stat-item">Tiros: <span id="lblTiros">0</span></div>
            </div>

            <div class="input-group" id="loginSessionBox">
                <label>Ingresa tu Cédula para jugar o recargar:</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="userCedulaInput" placeholder="Ej: V29123456">
                    <button class="btn-icon" onclick="registrarSesion()">Acceder</button>
                </div>
            </div>

            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <canvas id="wheelCanvas" width="300" height="300"></canvas>
            </div>

            <button class="btn-primary" id="spinBtn" onclick="girarRuleta()" disabled>¡Girar Ruleta!</button>
            <button class="btn-icon" style="width:100%; margin-top:10px; border-color:var(--gold); color:var(--gold);" onclick="openModal('paymentModal')">💳 Comprar / Reportar Pago Móvil</button>

            <div class="result-box" id="resultBox"></div>
        </div>
    </main>

    <!-- Modal de Comprobante / Pago Móvil -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('paymentModal')">&times;</button>
            <h3 style="color:var(--gold); margin-bottom:15px; font-family:'Cinzel',serif;">Datos de Pago Móvil</h3>
            <div class="bank-data">
                <p><strong>Banco:</strong> Banesco (0134)</p>
                <p><strong>Teléfono:</strong> 0414-0000000</p>
                <p><strong>Cédula:</strong> V-12.345.678</p>
                <p><strong>Monto por Giro:</strong> $5 o su Eq. en Bs.</p>
            </div>
            
            <hr style="border-color:rgba(255,255,255,0.1); margin:15px 0;">

            <h4 style="margin-bottom:10px; font-size:1rem;">Reporta tu Pago</h4>
            <div class="input-group">
                <label>Tu Cédula:</label>
                <input type="text" id="payCedula" placeholder="V29123456">
            </div>
            <div class="input-group">
                <label>Teléfono de contacto:</label>
                <input type="text" id="payTlf" placeholder="0426...">
            </div>
            <div class="input-group">
                <label>Número de Referencia Bancaria:</label>
                <input type="text" id="payRef" placeholder="Últimos 4 o ref completa">
            </div>
            <button class="btn-primary" onclick="enviarReportePago()">Enviar Reporte al Admin</button>
        </div>
    </div>

    <!-- Modal de Administración -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal('adminModal')">&times;</button>
            <h3 style="color:var(--neon-pink); margin-bottom:15px; font-family:'Cinzel',serif;">Panel de Control</h3>
            <div class="input-group">
                <label>PIN de Administrador:</label>
                <input type="password" id="adminPin" placeholder="****">
            </div>
            <button class="btn-icon" style="width:100%; margin-bottom:15px;" onclick="verificarAdmin()">Acceder Panel</button>

            <div id="adminPanelContent" style="display:none;">
                <hr style="border-color:rgba(255,255,255,0.1); margin:15px 0;">
                <h4 style="color:var(--neon-cyan); margin-bottom:10px;">Solicitudes Pendientes</h4>
                <div id="pendingPaymentsList" style="max-height:150px; overflow-y:auto; margin-bottom:15px; font-size:0.9rem; text-align:left;">
                    <p style="color:#888;">No hay pagos pendientes.</p>
                </div>

                <h4 style="color:var(--gold); margin-bottom:10px;">Cargar Giros a Usuario</h4>
                <div class="input-group">
                    <label>Cédula del Cliente:</label>
                    <input type="text" id="adminTargetCedula" placeholder="V29123456">
                </div>
                <div class="input-group">
                    <label>Cantidad de Giros a sumar:</label>
                    <input type="number" id="adminTirosCount" value="1" min="1">
                </div>
                <button class="btn-primary" onclick="adminOtorgarGiros()">Otorgar Giros</button>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN DE LA RULETA (Servicios Fijos Permitidos) ---
        const premios = [
            { texto: "Pack Express", color: "#9d00ff" },
            { texto: "Videollamada 5m", color: "#ff2a85" },
            { texto: "Custom Corto", color: "#00f3ff" },
            { texto: "Voz Íntima", color: "#7928ca" },
            { texto: "Intento Extra", color: "#ff0055" },
            { texto: "Sorpresa VIP", color: "#00dfc4" }
        ];

        let currentUser = null;
        let userTiros = 0;
        let isSpinning = false;
        let audioCtx = null;
        let isMusicPlaying = false;
        let musicInterval = null;

        // Base de Datos Local Simulada en Memoria (Sincronizada con localStorage)
        function getDb() {
            let db = JSON.parse(localStorage.getItem('casino_db')) || { users: {}, payments: [] };
            return db;
        }

        function saveDb(db) {
            localStorage.setItem('casino_db', JSON.stringify(db));
        }

        // --- GESTIÓN DE SESIÓN ---
        function registrarSesion() {
            const cedula = document.getElementById('userCedulaInput').value.trim().toUpperCase();
            if (!cedula) {
                alert("Por favor ingresa tu cédula.");
                return;
            }
            currentUser = cedula;
            let db = getDb();
            if (!db.users[cedula]) {
                db.users[cedula] = { tiros: 0 };
                saveDb(db);
            }
            userTiros = db.users[cedula].tiros;
            
            document.getElementById('lblCedula').innerText = cedula;
            document.getElementById('lblTiros').innerText = userTiros;
            document.getElementById('loginSessionBox').style.display = 'none';
            
            actualizarBotonGirar();
            playBeep(600, 0.1);
        }

        function actualizarBotonGirar() {
            const btn = document.getElementById('spinBtn');
            if (userTiros > 0) {
                btn.disabled = false;
                btn.innerText = `¡Girar Ruleta (${userTiros} disponibles)!`;
            } else {
                btn.disabled = true;
                btn.innerText = "Sin giros (Compra más abajo)";
            }
        }

        // --- AUDIO SINTETIZADOR (Web Audio API - Sin archivos externos) ---
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBeep(freq, duration, type = 'sine') {
            initAudio();
            if(!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function toggleAudio() {
            initAudio();
            isMusicPlaying = !isMusicPlaying;
            const btn = document.getElementById('audioBtn');
            if (isMusicPlaying) {
                btn.style.borderColor = 'var(--neon-pink)';
                btn.style.background = 'var(--neon-pink)';
                btn.style.color = 'white';
                // Secuencia ambiental cyberpunk suave en bucle
                const notas = [220, 246.94, 261.63, 329.63, 392.00];
                musicInterval = setInterval(() => {
                    if(!isMusicPlaying) return;
                    let nota = notas[Math.floor(Math.random() * notas.length)];
                    playBeep(nota, 0.4, 'triangle');
                }, 800);
            } else {
                btn.style.borderColor = 'var(--neon-cyan)';
                btn.style.background = 'transparent';
                btn.style.color = 'var(--neon-cyan)';
                clearInterval(musicInterval);
            }
        }

        function playWinSound() {
            playBeep(523.25, 0.15);
            setTimeout(() => playBeep(659.25, 0.15), 150);
            setTimeout(() => playBeep(783.99, 0.3), 300);
            setTimeout(() => playBeep(1046.50, 0.5), 450);
        }

        function playLoseSound() {
            playBeep(300, 0.2, 'sawtooth');
            setTimeout(() => playBeep(220, 0.4, 'sawtooth'), 200);
        }

        // --- RENDERIZADO DE LA RULETA EN CANVAS ---
        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const radius = canvas.width / 2;
        let currentAngle = 0;

        function dibujarRuleta(anguloRotacion = 0) {
            const arc = (2 * Math.PI) / premios.length;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            premios.forEach((premio, i) => {
                const angle = anguloRotacion + i * arc;
                ctx.beginPath();
                ctx.fillStyle = premio.color;
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 5, angle, angle + arc, false);
                ctx.lineTo(radius, radius);
                ctx.fill();
                ctx.strokeStyle = '#0a060f';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Texto
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 13px 'Rajdhani', sans-serif";
                ctx.fillText(premio.texto, radius - 15, 5);
                ctx.restore();
            });

            // Centro de la ruleta
            ctx.beginPath();
            ctx.arc(radius, radius, 18, 0, 2 * Math.PI);
            ctx.fillStyle = '#0a060f';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'var(--neon-pink)';
            ctx.stroke();
        }

        // --- LÓGICA DE GIRO ---
        function girarRuleta() {
            if (isSpinning || !currentUser || userTiros <= 0) return;
            
            isSpinning = true;
            let db = getDb();
            userTiros--;
            db.users[currentUser].tiros = userTiros;
            saveDb(db);
            document.getElementById('lblTiros').innerText = userTiros;
            actualizarBotonGirar();

            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'none';

            let spinAngleValue = Math.random() * 2000 + 3000; // Rotación aleatoria fuerte
            let start = null;
            let duration = 4000; // 4 segundos

            function animar(timestamp) {
                if (!start) start = timestamp;
