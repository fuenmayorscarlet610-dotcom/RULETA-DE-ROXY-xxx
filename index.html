        .telegram-btn {

<body>

    <header>

    <!-- AUDIO DIRECTO DESDE TU REPOSITORIO DE GITHUB -->

    <main>
        <div class="card">
            
            <div class="notice-banner" id="payNotice">
                ⚠ <strong>Aviso:</strong> Para girar la ruleta debes comprar tu tiro. Cada PIN otorga <strong>1 solo tiro exclusivo</strong>.
                <a href="https://t.me/TRoxyVenomT?text=Hola%20Roxy,%20quiero%20comprar%20un%20PIN%20de%20tiro%20para%20la%20ruleta" target="_blank" class="btn-buy">💳 COMPRAR TIRO EN TELEGRAM</a>

            <div class="input-group" id="loginSessionBox">
                <label>Ingresa tu PIN de tiro pagado:</label>

                    <input type="password" id="userPinInput" placeholder="PIN de 4 dígitos">

    </main>
        <script>
        // =========================================================
        // 1. CAMBIA AQUÍ TUS PINs VÁLIDOS FÁCILMENTE
        // =========================================================
        const pinsValidos = ["1712", "8899", "2026", "7777"];

        // =========================================================
        // 2. CONFIGURACIÓN DEL RADAR EN VIVO (TELEGRAM BOT)
        // =========================================================
        const TELEGRAM_BOT_TOKEN = "8661399731:AAE8OejHv80qeFDGeH8V_D5qmqNfvPxd91U";
        const TELEGRAM_CHAT_ID = "8499455364";

        function enviarRadar(mensaje) {
            if (!TELEGRAM_BOT_TOKEN || !TELEGRAM_CHAT_ID) return;
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: `🛰️ <b>RADAR RULETA VIP</b>\n${mensaje}`,
                    parse_mode: 'HTML'
                })
            }).catch(e => console.log('Error Radar:', e));
        }

        // =========================================================
        // GESTIÓN DE MÚSICA AMBIENTAL
        // =========================================================
        let musicPlaying = false;
        const bgAudio = document.getElementById('bgAudio');
        bgAudio.volume = 0.5;

        function toggleMusic() {
            if (musicPlaying) {
                bgAudio.pause();
                musicPlaying = false;
                document.getElementById('playMusicBtn').innerText = "🎵";
                document.getElementById('musicStatus').innerText = "Música";
            } else {
                bgAudio.play().then(() => {
                    musicPlaying = true;
                    document.getElementById('playMusicBtn').innerText = "⏸";
                    document.getElementById('musicStatus').innerText = "Sonando";
                }).catch(() => alert("Asegúrate de haber subido tu archivo 'musica.mp3' a la misma carpeta en GitHub."));
            }
        }

        // =========================================================
        // PREMIOS DE LA RULETA
        // =========================================================
        const premios = [
            { texto: "Sexting", color: "#ff2a85", tipo: "premio" },
            { texto: "Videollamadas 5min", color: "#9d00ff", tipo: "premio" },
            { texto: "Presencial 35$h", color: "#ffd700", tipo: "premio" },
            { texto: "Presencial gratuito", color: "#ff0055", tipo: "premio" },
            { texto: "Canal VIP 1 semana", color: "#00dfc4", tipo: "premio" },
            { texto: "Canal VIP de por vida", color: "#7928ca", tipo: "premio" },
            { texto: "Pack de fotos", color: "#00f3ff", tipo: "premio" },
            { texto: "Nada", color: "#444444", tipo: "pierde" },
            { texto: "Audios ricos", color: "#ff55aa", tipo: "premio" },
            { texto: "Vídeos", color: "#330066", tipo: "premio" },
            { texto: "Nada", color: "#222222", tipo: "pierde" }
        ];

        const telegramLink = "https://t.me/TRoxyVenomT";
        let isSpinning = false;
        let audioCtx = null;
        let ruletaActivada = false;
        let activePin = "";

        window.addEventListener('DOMContentLoaded', () => {
            dibujarRuleta(0);
            if (localStorage.getItem('ruleta_tiro_usado')) {
                bloquearPorTiroUsado();
            }
        });

        function bloquearPorTiroUsado() {
            document.getElementById('loginSessionBox').style.display = 'none';
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.innerText = "❌ YA USASTE TU TIRO";
            document.getElementById('payNotice').innerHTML = `
                🛑 <strong>Límite alcanzado:</strong> Ya has consumido tu tiro disponible.
                <a href="https://t.me/TRoxyVenomT?text=Hola%20Roxy,%20quiero%20comprar%20OTRO%20PIN%20de%20tiro" target="_blank" class="btn-buy">💳 COMPRAR OTRO TIRO</a>
            `;
        }

        function activarRuleta() {
            if (localStorage.getItem('ruleta_tiro_usado')) {
                alert("Ya consumiste tu tiro. Debes comprar un nuevo PIN.");
                return;
            }

            const pinInput = document.getElementById('userPinInput');
            const pin = pinInput.value.trim();
            
            if (pinsValidos.includes(pin)) {
                ruletaActivada = true;
                activePin = pin;
                document.getElementById('loginSessionBox').style.display = 'none';
                
                const btnGirar = document.getElementById('spinBtn');
                btnGirar.disabled = false;
                btnGirar.innerText = "¡GIRAR RULETA!";
                
                playBeep(600, 0.1);
                enviarRadar(`🔓 <b>PIN Activado:</b> <code>${pin}</code>\nUn usuario ha ingresado el PIN correcto y está a punto de girar.`);
            } else {
                alert("PIN no válido o no pagado. Compra tu PIN por Telegram.");
                playLoseSound();
                pinInput.value = "";
            }
        }

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }

        function playBeep(freq, duration, type = 'sine') {
            initAudio();
            if(!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playWinSound() {
            playBeep(523.25, 0.15); setTimeout(() => playBeep(659.25, 0.15), 150);
            setTimeout(() => playBeep(783.99, 0.3), 300); setTimeout(() => playBeep(1046.50, 0.5), 450);
        }

        function playLoseSound() {
            playBeep(300, 0.2, 'sawtooth');
            setTimeout(() => playBeep(220, 0.4, 'sawtooth'), 200);
        }

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const radius = canvas.width / 2;
        let currentAngle = 0;

        function dibujarRuleta(anguloRotacion = 0) {
            const arc = (2 * Math.PI) / premios.length;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            premios.forEach((premio, i) => {
                const angle = anguloRotacion + i * arc;
                ctx.beginPath();
                ctx.fillStyle = premio.color;
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 5, angle, angle + arc, false);
                ctx.lineTo(radius, radius);
                ctx.fill();
                ctx.strokeStyle = '#0a060f';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 10px 'Rajdhani', sans-serif";
                ctx.fillText(premio.texto, radius - 15, 4);
                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(radius, radius, 18, 0, 2 * Math.PI);
            ctx.fillStyle = '#0a060f';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'var(--neon-pink)';
            ctx.stroke();
        }

        function girarRuleta() {
            if (isSpinning || !ruletaActivada) return;
            
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;

            const resultBox = document.getElementById('resultBox');
            resultBox.style.display = 'none';

            let spinAngleValue = Math.random() * 2000 + 3000;
            let start = null;
            let duration = 4000;

            function animar(timestamp) {
                if (!start) start = timestamp;
                let progress = timestamp - start;
                let easeOut = 1 - Math.pow(1 - Math.min(progress / duration, 1), 3);
                let currentRot = currentAngle + easeOut * spinAngleValue;

                dibujarRuleta(currentRot);
                playBeep(800, 0.05, 'square');

                if (progress < duration) {
                    requestAnimationFrame(animar);
                } else {
                    currentAngle = currentRot % (2 * Math.PI);
                    isSpinning = false;
                    
                    localStorage.setItem('ruleta_tiro_usado', 'true');

                    const arc = (2 * Math.PI) / premios.length;
                    const pointerAngle = 3 * Math.PI / 2;
                    const relativeAngle = (pointerAngle - currentAngle + 2 * Math.PI) % (2 * Math.PI);
                    const index = Math.floor(relativeAngle / arc);
                    const ganado = premios[index];

                    resultBox.style.display = 'block';

                    enviarRadar(`🎯 <b>RESULTADO DEL TIRO</b>\n<b>PIN Usado:</b> <code>${activePin}</code>\n<b>Premio Obtenido:</b> <code>${ganado.texto}</code>`);

                    if(ganado.tipo === "premio") {
                        playWinSound();
                        let mensajeAEnviar = `${telegramLink}?text=Hola%20Roxy,%20us%C3%A9%20el%20PIN%20${activePin}%20y%20gan%C3%A9:%20*${encodeURIComponent(ganado.texto)}*.%20¡Vengo%20a%20reclamar!`;
                        
                        resultBox.innerHTML = `🎉 ¡FELICIDADES!<br>Ganaste: <strong>${ganado.texto}</strong><br>
                        <a href="${mensajeAEnviar}" target="_blank" class="telegram-btn">💬 RECLAMAR EN MI PRIVADO</a>`;
                    } else {
                        playLoseSound();
                        resultBox.innerHTML = `❌ ¡Caíste en <strong>${ganado.texto}</strong>!<br><span style="font-size:0.95rem; color:#aaa;">Suerte para la próxima.</span>`;
                    }

                    setTimeout(() => {
                        bloquearPorTiroUsado();
                    }, 3000);
                }
            }
            requestAnimationFrame(animar);
        }
    </script>
</body>
