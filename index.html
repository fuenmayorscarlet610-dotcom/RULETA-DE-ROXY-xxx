        // =========================================================
        // 2. AUDIO DE FONDO Y EFECTOS
        // =========================================================
        const bgAudio = document.getElementById('bgAudio');
        bgAudio.volume = 0.4;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(freq, duration, type = 'sine') {
            initAudio();
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function playTickSound() { playSound(800, 0.04, 'triangle'); }
        function playWinSound() {
            playSound(523, 0.15);
            setTimeout(() => playSound(659, 0.15), 120);
            setTimeout(() => playSound(783, 0.2), 240);
            setTimeout(() => playSound(1046, 0.5), 380);
        }
        function playLoseSound() {
            playSound(220, 0.2, 'sawtooth');
            setTimeout(() => playSound(140, 0.4, 'sawtooth'), 200);
        }

        const desbloquearAudio = () => {
            bgAudio.play().catch(()=>{});
            document.removeEventListener('click', desbloquearAudio);
            document.removeEventListener('touchstart', desbloquearAudio);
        };
        document.addEventListener('click', desbloquearAudio);
        document.addEventListener('touchstart', desbloquearAudio);

        // =========================================================
        // 3. DATOS DE LA RULETA
        // =========================================================
        const premios = [
            { texto: "Sexting", color: "#ff0055" },
            { texto: "1 Video", color: "#7000ff" },
            { texto: "Presencial 35$", color: "#ffb700" },
            { texto: "Audios Ricos", color: "#d90048" },
            { texto: "VIP 5 Días", color: "#00f3ff" },
            { texto: "VIP de por vida", color: "#5d00d6" },
            { texto: "Pack 5 Fotos", color: "#00b3cc" },
            { texto: "Perdiste", color: "#1a1025" },
            { texto: "Audios Ricos", color: "#cc0044" },
            { texto: "Presencial Video", color: "#330088" },
            { texto: "8 Fotos", color: "#0d0d0d" }
        ];

        let currentAngle = 0;
        let isSpinning = false;
        let ruletaActivada = false;

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const size = canvas.width;
        const center = size / 2;

        // =========================================================
        // 4. RENDERIZADO HD DE RULETA (CANVAS)
        // =========================================================
        function dibujarRuleta(angleOffset = 0) {
            const numSlices = premios.length;
            const sliceAngle = (2 * Math.PI) / numSlices;

            ctx.clearRect(0, 0, size, size);

            premios.forEach((premio, i) => {
                const startAngle = angleOffset + i * sliceAngle;
                const endAngle = startAngle + sliceAngle;

                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, center - 10, startAngle, endAngle);
                ctx.closePath();

                let grad = ctx.createRadialGradient(center, center, 50, center, center, center - 10);
                grad.addColorStop(0, '#0a0314');
                grad.addColorStop(0.6, premio.color);
                grad.addColorStop(1, '#000000');
                
                ctx.fillStyle = grad;
                ctx.fill();

                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 20px 'Rajdhani', sans-serif";
                ctx.shadowColor = "rgba(0,0,0,0.9)";
                ctx.shadowBlur = 8;
                ctx.fillText(premio.texto, center - 35, 7);
                ctx.restore();
            });

            ctx.beginPath();
            ctx.arc(center, center, 45, 0, 2 * Math.PI);
            ctx.fillStyle = '#030105';
            ctx.fill();
            ctx.lineWidth = 5;
            ctx.strokeStyle = 'var(--neon-pink)';
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(center, center, 15, 0, 2 * Math.PI);
            ctx.fillStyle = 'var(--neon-cyan)';
            ctx.fill();
        }

        // =========================================================
        // 5. CONTROL DE PIN Y ESTADOS (SOLUCIÓN AL BUG)
        // =========================================================
        window.addEventListener('DOMContentLoaded', () => {
            dibujarRuleta(0);
            verificarEstadoInicial();
        });

        function verificarEstadoInicial() {
            if (localStorage.getItem(MEMORY_KEY)) {
                mostrarPanelBloqueado(true);
            } else {
                mostrarPanelBloqueado(false);
            }
        }

        function mostrarPanelBloqueado(bloqueado) {
            const blockedPanel = document.getElementById('blockedPanel');
            const spinBtn = document.getElementById('spinBtn');
            const pinLabel = document.getElementById('pinLabel');

            if (bloqueado && !ruletaActivada) {
                blockedPanel.style.display = 'block';
                pinLabel.innerText = "🔑 Ingresa nuevo PIN para desbloquear:";
                spinBtn.disabled = true;
                spinBtn.innerText = "❌ TIRO CONSUMIDO";
            } else if (!ruletaActivada) {
                blockedPanel.style.display = 'none';
                pinLabel.innerText = "Insertar PIN para jugar";
                spinBtn.disabled = true;
                spinBtn.innerText = "🔒 ESPERANDO PIN...";
            }
        }

        function activarRuleta() {
            const pinInput = document.getElementById('userPinInput');
            const pin = pinInput.value.trim();
            
            if (pin === PIN_VALIDO) {
                localStorage.removeItem(MEMORY_KEY);
                
                ruletaActivada = true;
                document.getElementById('blockedPanel').style.display = 'none';
                document.getElementById('loginSessionBox').style.display = 'none';
                
                const btnGirar = document.getElementById('spinBtn');
                btnGirar.disabled = false;
                btnGirar.innerText = "⚡ ¡GIRAR RULETA VIP! ⚡";
                
                playSound(600, 0.15);
                enviarRadar(`🔓 <b>INGRESO APROBADO</b>\nPIN validado exitosamente. Usuario listo para girar.`);
            } else {
                alert("❌ PIN INCORRECTO. Verifica tu código o adquiere uno nuevo.");
                playLoseSound();
                pinInput.value = "";
            }
        }

        // =========================================================
        // 6. MOTOR DE ANIMACIÓN Y CONFETI
        // =========================================================
        function girarRuleta() {
            if (isSpinning || !ruletaActivada) return;

            isSpinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.innerText = "🎰 GIRANDO...";

            localStorage.setItem(MEMORY_KEY, 'true');

            const totalSlices = premios.length;
            const sliceAngle = (2 * Math.PI) / totalSlices;

            const randomSliceIndex = Math.floor(Math.random() * totalSlices);
            const extraTurns = 5 + Math.floor(Math.random() * 3); 
            
            const targetAngle = (extraTurns * 2 * Math.PI) + ((totalSlices - randomSliceIndex) * sliceAngle) - (sliceAngle / 2) - (Math.PI / 2);

            let startTimestamp = null;
            const duration = 5500;
            let lastSliceTick = -1;

            function animate(timestamp) {
                if (!startTimestamp) startTimestamp = timestamp;
                const elapsed = timestamp - startTimestamp;
                const progress = Math.min(elapsed / duration, 1);

                const easeOut = 1 - Math.pow(1 - progress, 3);
                currentAngle = targetAngle * easeOut;

                dibujarRuleta(currentAngle);

                const currentNormalizedAngle = (currentAngle + (Math.PI / 2)) % (2 * Math.PI);
                const currentSliceIndex = Math.floor((2 * Math.PI - currentNormalizedAngle) / sliceAngle) % totalSlices;
                
                if (currentSliceIndex !== lastSliceTick) {
                    playTickSound();
                    lastSliceTick = currentSliceIndex;
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    finalizarGiro(premios[randomSliceIndex]);
                }
            }

            requestAnimationFrame(animate);
        }

        function finalizarGiro(premioGanado) {
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.innerText = "❌ TIRO CONSUMIDO";

            enviarRadar(`🎉 <b>PREMIO OBTENIDO</b>\nEl usuario ganó: <b>${premioGanado.texto}</b>`);

                playLoseSound();
                alert("😔 Lo sentimos, no has obtenido premio esta vez.");
                mostrarPanelBloqueado(true);
                document.getElementById('loginSessionBox').style.display = 'block';
            } else {
                playWinSound();
                lanzarConfeti();
                
                const modal = document.getElementById('winModal');
                const prizeText = document.getElementById('modalPrizeText');
                const claimBtn = document.getElementById('modalClaimBtn');

                prizeText.innerText = premioGanado.texto;
                claimBtn.href = `https://t.me/TRoxyVenomT?text=Hola%20Roxy,%20¡Gané%20${encodeURIComponent(premioGanado.texto)}%20en%20la%20ruleta!%20Aquí%20tengo%20mi%20captura.`;
                
                modal.classList.add('active');
            }
        }

        // =========================================================
        // 7. SISTEMA DE CONFETI EN CANVAS
        // =========================================================
        function lanzarConfeti() {
            const confettiCnf = document.getElementById('confettiCanvas');
            const cCtx = confettiCnf.getContext('2d');
            confettiCnf.width = window.innerWidth;
            confettiCnf.height = window.innerHeight;

            let particles = [];
            const colors = ['#ff0055', '#7000ff', '#00f3ff', '#ffb700', '#ffffff'];

            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: window.innerWidth / 2,
                    y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 18,
                    vy: (Math.random() - 0.5) * 18 - 4,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    life: 100
                });
            }

            function drawParticles() {
                cCtx.clearRect(0, 0, confettiCnf.width, confettiCnf.height);
                particles.forEach((p, idx) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.2;
                    p.life -= 1.2;

                    cCtx.fillStyle = p.color;
                    cCtx.beginPath();
                    cCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    cCtx.fill();

                    if (p.life <= 0) particles.splice(idx, 1);
                });

                if (particles.length > 0) requestAnimationFrame(drawParticles);
            }

            drawParticles();
        }
    </script>
</body>
